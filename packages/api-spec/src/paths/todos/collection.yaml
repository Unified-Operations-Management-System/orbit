get:
  operationId: listTodos
  summary: List todos
  description: Returns every todo, oldest first.
  tags: [todos]
  responses:
    "200":
      description: All todos.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/todos/Todo.yaml
          example:
            - id: 1
              title: Read the README
              done: false
              createdAt: "2026-10-15T09:00:00Z"
            - id: 2
              title: Propose an API change in packages/api-spec
              done: true
              createdAt: "2026-10-15T09:05:00Z"
    default:
      $ref: ../../components/responses/UnexpectedError.yaml

post:
  operationId: createTodo
  summary: Create a todo
  description: Creates a todo that is not done yet.
  tags: [todos]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/todos/CreateTodoRequest.yaml
  responses:
    "201":
      description: The created todo.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/todos/Todo.yaml
    "422":
      $ref: ../../components/responses/ValidationFailed.yaml
    default:
      $ref: ../../components/responses/UnexpectedError.yaml
