# Production-like local run:  pnpm docker:up  (= docker compose up --build)
# The SQLite file lives in the orbit-data volume; `pnpm docker:reset` deletes it.
services:
  api:
    build: ./services/api
    # Dev data by default; `ORBIT_ENV=prod pnpm docker:up` runs the main (professor) data set.
    environment:
      ORBIT_ENV: ${ORBIT_ENV:-dev}
      DB_PATH: /data/orbit-${ORBIT_ENV:-dev}.db
    volumes:
      - orbit-data:/data
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8080
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  orbit-data:
