# Production-like local run:  docker compose up --build
services:
  api:
    build: ./services/api
    environment:
      ORBIT_ENV: prod
      DB_PATH: /data/orbit.db
    volumes:
      - orbit-data:/data
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8080
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  orbit-data:
