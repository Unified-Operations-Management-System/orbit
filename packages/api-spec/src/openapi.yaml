openapi: 3.1.0
info:
  title: Orbit API
  version: 1.0.0
  description: |
    The contract between the Go API, the Next.js web app and the Expo mobile app.

    This file and everything under `src/` is hand-written and is the single source of
    truth. The Go server interfaces and the TypeScript client are generated from it.
    See `packages/api-spec/README.md` for how to propose a change.
servers:
  # Relative: each client sets its own base URL (web: API_URL, mobile: EXPO_PUBLIC_API_URL).
  - url: /
    description: Same host the client is configured to call
tags:
  - name: system
    description: Operational endpoints.
  - name: todos
    description: Todo items.
  - name: auth
    description: Sign-in session (Organization and Access Management).
  - name: members
    description: Company membership (Organization and Access Management).

paths:
  /health:
    $ref: paths/system/health.yaml
  /todos:
    $ref: paths/todos/collection.yaml
  /todos/{id}:
    $ref: paths/todos/item.yaml
  /auth/session:
    $ref: paths/auth/session.yaml
  /members:
    $ref: paths/members/collection.yaml
  /members/{memberId}/approve:
    $ref: paths/members/approve.yaml
  /members/{memberId}/deactivate:
    $ref: paths/members/deactivate.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token from sign-in. In development the API accepts `dev:<role>`
        (owner, supervisor, employee, hr-admin). The production token type is not decided
        yet (API-issued or Firebase); it plugs in behind the same scheme.
