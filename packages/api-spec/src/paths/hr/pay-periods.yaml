get:
  operationId: listPayPeriods
  summary: List pay periods
  description: |
    The company's pay periods, oldest first.
  tags: [hr]
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Pay periods.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/hr/PayPeriod.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    default:
      $ref: ../../components/responses/UnexpectedError.yaml
