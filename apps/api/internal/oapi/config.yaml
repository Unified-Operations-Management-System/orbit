# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# Generates types + a strict net/http server interface from packages/api-spec/dist/openapi.yaml.
package: oapi
output: oapi.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
