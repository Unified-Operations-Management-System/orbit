parameters:
  - $ref: ../../components/parameters/MemberId.yaml

post:
  operationId: approveMember
  summary: Approve a pending member
  description: Moves a Pending member to Active (UC-OAM-02). Refused with 409 if the invitation has expired or the member is not pending. Only the owner and HR administrators may do this.
  tags: [members]
  security:
    - bearerAuth: []
  responses:
    "200":
      description: The member, status Active.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/members/Member.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "409":
      $ref: ../../components/responses/Conflict.yaml
    "422":
      $ref: ../../components/responses/ValidationFailed.yaml
    default:
      $ref: ../../components/responses/UnexpectedError.yaml
