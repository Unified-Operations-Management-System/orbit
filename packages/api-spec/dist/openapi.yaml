openapi: 3.1.0
info:
  title: Orbit API
  version: 1.0.0
  description: |
    The contract between the Go API, the Next.js web app and the Expo mobile app.

    This file and everything under `src/` is hand-written and is the single source of
    truth. The Go server interfaces and the TypeScript client are generated from it.
    See `packages/api-spec/README.md` for how to propose a change.
servers:
  - url: /
    description: Same host the client is configured to call
tags:
  - name: system
    description: Operational endpoints.
  - name: todos
    description: Todo items.
  - name: auth
    description: Sign-in session (Organization and Access Management).
  - name: members
    description: Company membership (Organization and Access Management).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns `ok` when the API process is up.
      tags:
        - system
      responses:
        '200':
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /todos:
    get:
      operationId: listTodos
      summary: List todos
      description: Returns every todo, oldest first.
      tags:
        - todos
      responses:
        '200':
          description: All todos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              example:
                - id: 1
                  title: Read the README
                  done: false
                  createdAt: '2026-10-15T09:00:00Z'
                - id: 2
                  title: Propose an API change in packages/api-spec
                  done: true
                  createdAt: '2026-10-15T09:05:00Z'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createTodo
      summary: Create a todo
      description: Creates a todo that is not done yet.
      tags:
        - todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: The created todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    patch:
      operationId: updateTodo
      summary: Mark a todo done or not done
      description: Sets the `done` flag of one todo.
      tags:
        - todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: The updated todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      description: Permanently removes one todo.
      tags:
        - todos
      responses:
        '204':
          description: The todo was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/session:
    get:
      operationId: getSession
      summary: Get the signed-in member
      description: |
        Returns the membership of the caller identified by the bearer token. Pending or
        deactivated members are refused (UC-OAM-08 Sign In).
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /members:
    get:
      operationId: listMembers
      summary: List members
      description: Returns every member of the caller's company, oldest invitation first.
      tags:
        - members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All members of the company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: inviteMember
      summary: Invite a member
      description: |
        Adds a Pending member and sends the invitation (UC-OAM-01). Only the owner and HR
        administrators may invite, nobody can be invited as Owner, and an email can belong to
        one member only. The invitation expires after 7 days.
      tags:
        - members
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: The invited member, status Pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /members/{memberId}/approve:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      operationId: approveMember
      summary: Approve a pending member
      description: Moves a Pending member to Active (UC-OAM-02). Refused with 409 if the invitation has expired or the member is not pending. Only the owner and HR administrators may do this.
      tags:
        - members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The member, status Active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /members/{memberId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      operationId: deactivateMember
      summary: Deactivate a member
      description: Ends a member's access immediately (UC-OAM-03). The owner cannot be deactivated (409). Only the owner and HR administrators may do this.
      tags:
        - members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The member, status Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token from sign-in. In development the API accepts `dev:<role>`
        (owner, supervisor, employee, hr-admin). The production token type is not decided
        yet (API-issued or Firebase); it plugs in behind the same scheme.
  schemas:
    FieldError:
      title: FieldError
      type: object
      required:
        - location
        - message
      properties:
        location:
          type: string
          description: Where the error is, e.g. `body.title` or `path.id`.
          examples:
            - body.title
        message:
          type: string
          description: What is wrong with the value.
          examples:
            - must be at least 1 character
    Problem:
      title: Problem
      description: An error, as RFC 9457 problem details, with an optional list of field errors.
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: A URI identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          examples:
            - Unprocessable Entity
        status:
          type: integer
          description: The HTTP status code.
          examples:
            - 422
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
          examples:
            - validation failed
        errors:
          type: array
          description: Field-level errors, present when request validation fails.
          items:
            $ref: '#/components/schemas/FieldError'
    Health:
      title: Health
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always `ok` when the process can serve requests.
    Todo:
      title: Todo
      type: object
      required:
        - id
        - title
        - done
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Todo ID.
          examples:
            - 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: What needs doing.
          examples:
            - Ship it
        done:
          type: boolean
          description: Whether it is finished.
        createdAt:
          type: string
          format: date-time
          description: When it was created (UTC).
    CreateTodoRequest:
      title: CreateTodoRequest
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: What needs doing.
          examples:
            - Ship it
    UpdateTodoRequest:
      title: UpdateTodoRequest
      type: object
      additionalProperties: false
      required:
        - done
      properties:
        done:
          type: boolean
          description: The new value of the `done` flag.
    MemberRole:
      title: MemberRole
      type: string
      enum:
        - Owner
        - Supervisor
        - Employee
        - HR Admin
      description: What the member may do in Orbit (see the roles matrix).
      examples:
        - Employee
    MemberStatus:
      title: MemberStatus
      type: string
      enum:
        - Pending
        - Active
        - Deactivated
      description: Pending until approved; Deactivated members cannot sign in.
      examples:
        - Pending
    Member:
      title: Member
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - invitedAt
        - expiresAt
      properties:
        id:
          type: string
          description: Member ID.
          examples:
            - m-5
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Full name.
          examples:
            - Casey Brown
        email:
          type: string
          format: email
          description: Sign-in email, unique within the company.
          examples:
            - casey@example.com
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        invitedAt:
          type: string
          format: date-time
          description: When the invitation was created (UTC).
        expiresAt:
          type: string
          format: date-time
          description: When a pending invitation expires (UTC), 7 days after invitedAt.
    InviteMemberRequest:
      title: InviteMemberRequest
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Full name of the person being invited.
          examples:
            - Casey Brown
        email:
          type: string
          format: email
          maxLength: 254
          description: Where the invitation is sent.
          examples:
            - casey@example.com
        role:
          $ref: '#/components/schemas/MemberRole'
  responses:
    UnexpectedError:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
            detail: something went wrong
    ValidationFailed:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Entity
            status: 422
            detail: validation failed
            errors:
              - location: body.title
                message: must be at least 1 character
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: todo not found
    Unauthorized:
      description: Not signed in, or the token is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
            detail: not signed in
    Forbidden:
      description: Signed in, but your role may not do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            detail: not allowed for your role
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: a member with this email already exists
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: Todo ID.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    MemberId:
      name: memberId
      in: path
      required: true
      description: Member ID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: m-5
