title: Schedule
type: object
description: Shifts and time off in a date range.
required: [from, to, shifts, timeOff]
properties:
  from:
    type: string
    format: date-time
  to:
    type: string
    format: date-time
  shifts:
    type: array
    items:
      $ref: Shift.yaml
  timeOff:
    type: array
    items:
      $ref: TimeOff.yaml
